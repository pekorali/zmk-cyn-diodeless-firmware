# Общие предложения по опциям для sofle_diodless.
# Всё закомментировано: пользователь может включать/выключать сам.

# ── Дисплей SSD1306 (128x32, I2C1: SDA=P0.16, SCL=P0.17) ──
# CONFIG_ZMK_DISPLAY=y

# ── Энкодеры EC11 (A=P1.08, B=P1.09) ──
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

# ── Полный NKRO (абсолютный для GUI/LOWER/ENTER/ENC_BTN) ──
# ВНИМАНИЕ: NKRO ломает совместимость с некоторыми BIOS/UEFI.
# Включено по умолчанию в config/sofle_diodless.conf
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ── Глубокий сон ──
# Требует настройки wakeup-источников; прямые клавиши и матрица
# уже помечены wakeup-source, поэтому обычно достаточно:
# CONFIG_ZMK_SLEEP=y

# ── RGB / подсветка ──
# ВНИМАНИЕ: WS2812 по SPI3/SPI1 конфликтует с выводами этой
# раскладки (P1.13 / P0.10 / P1.11). Не включайте без правки dtsi.
# CONFIG_ZMK_RGB_UNDERGLOW=y