# Пользовательские настройки sofle_diodless (применяются поверх shield).
# ZMK читает <ZMK_CONFIG>/<shield>.conf — то есть
# config/sofle_diodless.conf и config/sofle_diodless_left.conf.

# ── Полный NKRO ──────────────────────────────────────────────────────────
# Базовая матрица 5x6 уже даёт NKRO для 26 буквенных клавиш,
# а GUI / LOWER / ENTER / ENC_BTN на прямых GPIO работают как
# абсолютный NKRO. Включаем полный NKRO-режим HID.
# (Минус: некоторые BIOS/UEFI и Android плохо дружат с NKRO —
#  если столкнётесь с проблемами, закомментируйте строку.)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ── Защита от залипания ──────────────────────────────────────────────────
# Клавиша, непрерывно зажатая дольше лимита (300000 мс = 5 минут),
# принудительно отпускается до фактического размыкания контактов.
# На одновременные нажатия не влияет: порог — минуты удержания одной
# клавиши. Отключить: поставить 0.
CONFIG_ZMK_KSCAN_GPIO_MATRIX_HIZ_STUCK_KEY_TIMEOUT_MS=300000

# Раскомментируйте, если хотите OLED:
# CONFIG_ZMK_DISPLAY=y

# Раскомментируйте, если хотите энкодеры:
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y