# Пользовательские настройки sofle_diodless (применяются поверх shield).
# ZMK читает <ZMK_CONFIG>/<shield>.conf — то есть
# config/sofle_diodless.conf и config/sofle_diodless_left.conf.

# ── Полный NKRO ──────────────────────────────────────────────────────────
# Базовая матрица 5x6 уже даёт NKRO для 26 буквенных клавиш,
# а GUI / LOWER / ENTER / ENC_BTN на прямых GPIO работают как
# абсолютный NKRO. Включаем полный NKRO-режим HID.
# (Минус: некоторые BIOS/UEFI и Android плохо дружат с NKRO —
#  если столкнётесь с проблемами, закомментируйте строку.)
CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y

# ── Фильтр призраков: ВЫКЛЮЧЕН ───────────────────────────────────────────
# Эвристика фильтра угадывает 50/50 (проверено на модели: 2256 сценариев,
# docs/tools/filter-model-check.py): в половине случаев лишняя клавиша
# подавлена, в половине — подавлена РЕАЛЬНАЯ клавиша, а фантом прошёл.
# Для набора текста честный фантом (все нужные клавиши + одна лишняя)
# лучше потерянной буквы, поэтому фильтр отключён.
# Вернуть: закомментируйте строку ниже (или поставьте =y).
CONFIG_ZMK_KSCAN_GPIO_MATRIX_HIZ_GHOST_FILTER=n

# Защита от залипания: ВЫКЛЮЧЕНА — прошивка ведёт себя в точности как
# исходный hiz-сканер. Включить при желании (например, 300000 = 5 минут):
# CONFIG_ZMK_KSCAN_GPIO_MATRIX_HIZ_STUCK_KEY_TIMEOUT_MS=300000

# Раскомментируйте, если хотите OLED:
# CONFIG_ZMK_DISPLAY=y

# Раскомментируйте, если хотите энкодеры:
# CONFIG_EC11=y
# CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y